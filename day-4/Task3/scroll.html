<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virtual Scroll</title>
    <script src="scroll.js" defer></script>
    <style>
      * {
        border: 0;
        box-sizing: border-box;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      #scroll-container {
        height: 500px;
        width: 300px;
        border: 1px solid black;
        position: relative;
        overflow-y: auto;
      }

      #scroll {
        position: absolute;
        left: 0;
        top: 0;
        right: 0;
      }

      #list-content {
        position: absolute;
        left: 0;
        top: 0;
        right: 0;
      }

      .list-item {
        height: 50px;
        line-height: 40px;
        text-align: center;
        padding-left: 15px;
        border-bottom: 1px solid black;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="scroll-container">
        <div id="scroll"></div>
        <div id="list-content"></div>
      </div>
    </main>
  </body>
</html>
