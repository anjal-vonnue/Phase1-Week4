<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ResizeObserver Chart</title>

    <style>
      * {
        box-sizing: border-box;
      }

      .chart-container {
        border: 2px solid darkblue;

        display: flex;
        align-items: flex-end;
        gap: 5px;

        padding: 10px;

        width: 100%;
        height: 300px;

        resize: both;
        overflow: auto;
      }

      .bar {
        flex: 1;
        min-width: 5px;
        background-color: red;
        width: 20px;
      }

      .size {
        margin-top: 10px;
      }
    </style>
    <script src="chart.js" defer></script>
  </head>

  <body>
    <div class="chart-container" id="chart">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>

    <div class="size" id="size"></div>
  </body>
</html>
