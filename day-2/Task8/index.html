<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>INTERSECTION OBSERVER ADVANCED</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Header</h1>
    </header>
    <section data-title="Section 1">
      <h2>Section 1</h2>
      <img class="image" data-src="https://picsum.photos/200" />
    </section>
    <section data-title="Section 2">
      <h2>Section 2</h2>
      <img class="image" data-src="https://picsum.photos/201" />
    </section>
    <section data-title="Section 3">
      <h2>Section 3</h2>
      <img class="image" data-src="https://picsum.photos/202" />
    </section>
    <section data-title="Section 4">
      <h2>Section 4</h2>
      <img class="image" data-src="https://picsum.photos/203" />
    </section>
    <section data-title="Section 5">
      <h2>Section 5</h2>
      <img class="image" data-src="https://picsum.photos/204" />
    </section>
    <section data-title="Section 6" class="counter">
      <h2>Section 6</h2>
      <p></p>
      <progress id="progress" value="0" max="100"></progress>
      <p id="loading"></p>

      <button id="upload-file">Upload File</button>

      <!-- https://unwiredlearning.com/blog/css-transform-performance -->
      <h2>LAYOUT VS COMPOSITOR ONLY</h2>
      <div class="box-container-layout">
        <div class="box-layout"></div>
      </div>

      <div class="box-container-transform">
        <div class="box-transform"></div>
      </div>
    </section>
  </body>
</html>
